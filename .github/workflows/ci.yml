name: CI
on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
  web:
    # The plugin's web/ is injected into a project by `togo install`; it is not a
    # standalone app. test-harness/ assembles it into a minimal Next project
    # (the stand-in for the create-togo-app template) and checks it there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test-harness/template/package-lock.json
      - run: node test-harness/assemble.mjs
      - run: npm ci
        working-directory: test-harness/.build
      - run: npm run lint
        working-directory: test-harness/.build
      - run: npm run typecheck
        working-directory: test-harness/.build
      - run: npm test
        working-directory: test-harness/.build
      - run: npm run build
        working-directory: test-harness/.build
      # The page guard end to end: next start on the build above, against a real
      # kernel with DASHBOARD_REQUIRED_ROLE set (webguard_e2e_test.go).
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -tags webe2e -run TestWebGuard -count=1 .
